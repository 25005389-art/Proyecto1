[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "clase_2"
version = "0.0.1"
description = "Proyecto de la Clase 2 de Product Development"
authors = [
  { name = "Bernard Z\u00fa\u00f1iga" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["clase_2"]
include = ["pyproject.toml", "clase_2/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["clase_2"]
force-sort-within-sections = true

